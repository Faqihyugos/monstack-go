syntax = "proto3";

package monstack.agent.v1;

option go_package = "github.com/Faqihyugos/monstack-go/api/proto";

service AgentService {
  // Bi-directional stream for telemetry ingestion and remote control commands
  rpc Connect(stream AgentMessage) returns (stream ServerMessage);

  // One-shot agent registration
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Health check
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

message AgentMessage {
  string agent_id = 1;
  int64 timestamp = 2;
  MetricsBatch metrics = 3;
  Heartbeat heartbeat = 4;
}

message ServerMessage {
  string type = 1; // ack | command | config_update
  string command = 2;
  map<string, string> params = 3;
  string message = 4;
}

message MetricsBatch {
  repeated Metric metrics = 1;
}

message Metric {
  string name = 1;
  double value = 2;
  int64 timestamp = 3;
  map<string, string> labels = 4;
}

message Heartbeat {
  string status = 1;
  double uptime_seconds = 2;
}

message RegisterRequest {
  string agent_id = 1;
  string hostname = 2;
  string ip_address = 3;
  string os = 4;
  string arch = 5;
  string agent_version = 6;
  repeated string collectors = 7;
  map<string, string> labels = 8;
}

message RegisterResponse {
  string agent_id = 1;
  bool accepted = 2;
  string message = 3;
}

message HealthCheckRequest {
  string agent_id = 1;
}

message HealthCheckResponse {
  bool healthy = 1;
  string server_version = 2;
}
